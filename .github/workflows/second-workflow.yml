name: Second-workflow
# when push code then run automatically 
# on: push    

# manually trigger the workflow
on: 
  push:
  workflow_dispatch:

jobs:
  hello-job:
    runs-on: ubuntu-latest
    steps:
      - name: "welcome"
        run: echo "Welcome to the second workflow!"

  good-bye-job:
    runs-on: ubuntu-latest
    steps:
      - name: "good-bye"
        run: echo "Good-bye from the second workflow!"